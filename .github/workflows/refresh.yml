name: Refresh NFL picks

on:
  workflow_dispatch:          # "Run workflow" button on GitHub
  schedule:                   # times are UTC; ET = UTC-4 (EDT) / UTC-5 (EST)
    - cron: "5 13 * * *"      # every day ~9 AM ET
    - cron: "35 15 * * 0"     # Sunday ~11:30 AM ET, before 1 PM kickoffs
    - cron: "5 19 * * 0"      # Sunday ~3 PM ET, before 4 PM kickoffs
    - cron: "5 23 * * 0"      # Sunday ~7 PM ET, before the night game
    - cron: "5 21 * * 1,4"    # Monday and Thursday ~5 PM ET, before night games

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Settled games' trades are cached between runs so only open games re-download.
      - uses: actions/cache@v4
        with:
          path: cache
          key: trades-${{ github.run_id }}
          restore-keys: trades-

      - name: Run analysis
        run: python nfl_sharps.py

      - name: Save results to the repo
        run: |
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add results/latest.json
          git diff --cached --quiet || git commit -m "Refresh picks $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
